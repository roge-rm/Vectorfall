services:
  game:
    network_mode: bridge
    environment:
      SKIFREI_GAME_PORT: "27300"
      SKIFREI_WS_PORT: "27302"
      SKIFREI_DISCOVERY: "0"
    ports:
      - "${GAME_PORT:-27300}:27300/udp"
      - "${WS_PORT:-27302}:27302/tcp"
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-27303}:27303/tcp"

  web:
    network_mode: "service:game"
    environment:
      SKIFREI_WEB_BIND: "0.0.0.0"
      SKIFREI_WEB_PORT: "27303"
      SKIFREI_PUBLIC_GAME_PORT: "${GAME_PORT:-27300}"
      SKIFREI_PUBLIC_WS_PORT: "${WS_PORT:-27302}"
