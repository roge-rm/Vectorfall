name: skifrei

services:
  game:
    build:
      context: .
      dockerfile: server/Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      SKIFREI_NAME: "${SERVER_NAME:-Skifrei}"
      SKIFREI_MAP: "${MAP:-ochre_fold}"
      SKIFREI_TEAM_SIZE: "${TEAM_SIZE:-8}"
      SKIFREI_MINUTES: "${MINUTES:-20}"
      SKIFREI_MODE: "${MODE:-ctf}"
      SKIFREI_ROTATION: "${ROTATION:-}"
      SKIFREI_DIRECTORY_URL: "${DIRECTORY_URL:-}"
      SKIFREI_DIRECTORY_TOKEN: "${DIRECTORY_TOKEN:-}"
      SKIFREI_PUBLIC_HOST: "${PUBLIC_HOST:-}"
      SKIFREI_PUBLIC_WS: "${PUBLIC_WS:-}"
      SKIFREI_PUBLIC_GAME_PORT: "${GAME_PORT:-27300}"
      SKIFREI_MIDFIELD_RESUPPLY: "${MIDFIELD_RESUPPLY:-0}"
      SKIFREI_CAPTURES: "${CAPTURES:-5}"
      SKIFREI_GAME_PORT: "${GAME_PORT:-27300}"
      SKIFREI_DISCOVERY_PORT: "${DISCOVERY_PORT:-27301}"
      SKIFREI_WS_PORT: "${WS_PORT:-27302}"
    volumes:
      - state:/state

  web:
    build:
      context: .
      dockerfile: server/web.Dockerfile
    network_mode: host
    restart: unless-stopped
    depends_on:
      - game
    environment:
      SKIFREI_WEB_BIND: "${WEB_BIND:-127.0.0.1}"
      SKIFREI_WEB_PORT: "${WEB_PORT:-27303}"
      SKIFREI_PUBLIC_WS: "${PUBLIC_WS:-}"
      SKIFREI_ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - state:/state
      - "${PLAY_DIR:-./build/web}:/play:ro"

volumes:
  state:
