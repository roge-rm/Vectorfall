services:
  game:
    build:
      context: .
      dockerfile: server/Dockerfile
    network_mode: host
    restart: unless-stopped
    environment:
      VECTORFALL_NAME: "${SERVER_NAME:-Vectorfall}"
      VECTORFALL_MAP: "${MAP:-ochre_fold}"
      VECTORFALL_TEAM_SIZE: "${TEAM_SIZE:-8}"
      VECTORFALL_MINUTES: "${MINUTES:-20}"
      VECTORFALL_CAPTURES: "${CAPTURES:-5}"
      VECTORFALL_GAME_PORT: "${GAME_PORT:-27300}"
      VECTORFALL_DISCOVERY_PORT: "${DISCOVERY_PORT:-27301}"
      VECTORFALL_WS_PORT: "${WS_PORT:-27302}"
    volumes:
      - state:/state

  web:
    build:
      context: .
      dockerfile: server/web.Dockerfile
    network_mode: host
    restart: unless-stopped
    depends_on:
      - game
    environment:
      VECTORFALL_WEB_BIND: "${WEB_BIND:-127.0.0.1}"
      VECTORFALL_WEB_PORT: "${WEB_PORT:-27303}"
      VECTORFALL_PUBLIC_WS: "${PUBLIC_WS:-}"
      VECTORFALL_ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - state:/state
      - "${PLAY_DIR:-./build/web}:/play:ro"

volumes:
  state:
